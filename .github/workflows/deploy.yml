name: Build MyTube Android Debug APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Install Android launcher icons
        shell: bash
        run: |
          set -euo pipefail

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            source_dir="picture/android/res/mipmap-${density}"
            target_dir="android/app/src/main/res/mipmap-${density}"

            mkdir -p "$target_dir"

            cp "$source_dir/MyTube.png" "$target_dir/ic_launcher.png"
            cp "$source_dir/MyTube.png" "$target_dir/ic_launcher_round.png"

            cp "$source_dir/MyTube_background.png" "$target_dir/mytube_background.png"
            cp "$source_dir/MyTube_foreground.png" "$target_dir/mytube_foreground.png"
            cp "$source_dir/MyTube_monochrome.png" "$target_dir/mytube_monochrome.png"
          done

          adaptive_target="android/app/src/main/res/mipmap-anydpi-v26"
          mkdir -p "$adaptive_target"

          cat > "$adaptive_target/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@mipmap/mytube_background" />
            <foreground android:drawable="@mipmap/mytube_foreground" />
            <monochrome android:drawable="@mipmap/mytube_monochrome" />
          </adaptive-icon>
          EOF

          cp "$adaptive_target/ic_launcher.xml" "$adaptive_target/ic_launcher_round.xml"

      - name: Copy web icons and optional photos
        shell: bash
        run: |
          set -euo pipefail

          cp picture/web/favicon.ico www/favicon.ico
          cp picture/web/apple-touch-icon.png www/apple-touch-icon.png
          cp picture/web/icon-192.png www/icon-192.png
          cp picture/web/icon-192-maskable.png www/icon-192-maskable.png
          cp picture/web/icon-512.png www/icon-512.png
          cp picture/web/icon-512-maskable.png www/icon-512-maskable.png

          if [ -d "picture/photos" ]; then
            mkdir -p www/pictures
            cp -R picture/photos/. www/pictures/
          fi

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare named APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/MyTube.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-apk
          path: release-assets/MyTube.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-debug-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate version tag
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag harus mengikuti format vMAJOR.MINOR.PATCH, misalnya v1.0.0."
            exit 1
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MyTube-apk
          path: release-assets

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" release-assets/MyTube.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$VERSION_TAG" release-assets/MyTube.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "MyTube $VERSION_TAG" \
              --generate-notes
          fi