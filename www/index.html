<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Cari dan temukan video YouTube dengan MyTube.">
  <title>MyTube — Pencarian Video</title>

  <script>
    try {
      const savedTheme = localStorage.getItem("mytube-theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch {
      // Gunakan tema terang jika penyimpanan browser tidak tersedia.
    }
  </script>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="MyTube beranda">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">MyTube</span>
    </a>

    <button
      class="theme-toggle"
      id="theme-toggle"
      type="button"
      aria-label="Aktifkan dark mode"
      aria-pressed="false"
    >
      <span class="theme-icon" id="theme-icon" aria-hidden="true">◐</span>
      <span id="theme-label">Dark mode</span>
    </button>
  </header>

  <main class="page">
    <section class="search-section" aria-labelledby="page-title">
      <p class="eyebrow">PENCARIAN VIDEO</p>
      <h1 id="page-title">Temukan tontonanmu.</h1>
      <p class="intro">Cari video YouTube berdasarkan judul, topik, atau kanal.</p>

      <form class="search-form" id="search-form" role="search">
        <label class="visually-hidden" for="search-input">
          Kata kunci pencarian
        </label>
        <input
          id="search-input"
          name="q"
          type="search"
          placeholder="Contoh: belajar desain"
          autocomplete="off"
          maxlength="100"
          required
        >
        <button class="search-button" id="search-button" type="submit">
          <span class="button-label">Cari</span>
          <span aria-hidden="true">↗</span>
        </button>
      </form>
      <p class="search-hint">Tekan Enter untuk mencari</p>
    </section>

    <section class="results-section" aria-labelledby="results-heading">
      <div class="results-header">
        <h2 id="results-heading">Hasil</h2>
        <span class="results-count" id="results-count"></span>
      </div>

      <p class="status-message" id="status-message" role="status" aria-live="polite">
        Masukkan kata kunci untuk mulai mencari video.
      </p>

      <div class="results-grid" id="results-grid"></div>

      <div class="load-more-wrap">
        <button
          class="load-more-button"
          id="load-more-button"
          type="button"
          hidden
        >
          Muat lebih banyak
        </button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>MyTube</span>
    <span>Hasil pencarian disediakan oleh YouTube.</span>
  </footer>
</body>
</html>
